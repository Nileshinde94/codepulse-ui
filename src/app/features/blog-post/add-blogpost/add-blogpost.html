<div class="container">
  <h1 class="mt-3">Add Blog Posts</h1>

  <form class="mt-3" [formGroup]="addBlogPostForm" (ngSubmit)="onSubmit()">

    <div class="mb-3">
      <label class="form-label">Title</label>
      <input type="text" class="form-control" formControlName="title">
    </div>

    <div class="mb-3">
      <label class="form-label">Short Description</label>
      <textarea class="form-control" rows="5" formControlName="shortDescription"></textarea>
    </div>

    <div class="mb-3">

      <div  class="d-flex flex-row">
        <div class="col-6 p-2">
        <label class="form-label">Content</label>
      <textarea class="form-control" rows="5" formControlName="content"></textarea>
        </div>
        <div class="col-6 p-2" style="max-height: 350px; overflow-y: auto;">
          <markdown [data]="addBlogPostForm.controls.content.getRawValue() || ''"></markdown>
        </div>

      </div>
     
    </div>

    <div class="mb-3">
      <label class="form-label">Featured Image URL</label>
      @if(addBlogPostForm.controls.featuredImageUrl.getRawValue())
      {
        <img  [src]="addBlogPostForm.controls.featuredImageUrl.getRawValue()" alt="Featured Image" class="my-2" style="width:100px;">
        }
        <div class="mb-2">
          <img [src]="addBlogPostForm.controls.featuredImageUrl.getRawValue()" alt="Featured Image" class="img-fluid">
        </div>
      
      <input type="text" class="form-control" formControlName="featuredImageUrl">
    </div>

    <div class="mb-3">
      <label class="form-label">URL Handle</label>
      <input type="text" class="form-control" formControlName="urlHandle">
    </div>

    <div class="mb-3">
      <label class="form-label">Publish Date</label>
      <input type="date" class="form-control" formControlName="publishedDate">
    </div>

    <div class="mb-3">
      <label class="form-label">Author</label>
      <input type="text" class="form-control" formControlName="author">
    </div>

    <div class="form-check mb-3">
      <input type="checkbox" class="form-check-input" formControlName="isVisible">
      <label class="form-check-label">Is Visible?</label>
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="addBlogPostForm.invalid">
      Submit
    </button>

  </form>
</div>
